<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embedded Playground AI</title>
  <meta http-equiv="refresh" content="0; url=/html-pages/index.html" />
  <script>
    // Fallback cho trường hợp meta refresh bị chặn
    (function () {
      try {
        if (location.pathname === '/' || location.pathname.endsWith('\\index.html') || location.pathname === '') {
          location.replace('/html-pages/index.html');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <p>Đang chuyển tới <a href="/html-pages/index.html">trang chủ</a>...</p>
</body>
</html>
